                /* Transformando link em botão com estilos */

                a:link, a:visited{
                    background-color: rebeccapurple;
                    color:blue;
                     text-decoration: none;
                    padding: 15px 25px;
                    display:inline-block;
                    border: 4px solid grey;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 16px;
                    font-weight: bold;

                }

                a:hover, a:active{
                    background-color: black;
                    color: black;
                    border: 3px solid green;
                    transition: .5s;
                }

                a:active{
                    box-shadow: inset 0 0 10px 0 yellow ;
                }


        </style>
    </head>
    <body>
        <h1>Mudando estilos do Link</h1>


            <a href="###">Isso é um link</a>

        <hr>

            <h3>Definindo estilo de botão em Link</h3>

            <a href="###">Link</a>
