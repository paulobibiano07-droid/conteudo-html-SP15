<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteudo Aula09 - HTML</title>
    </head>
    <body>

        <h1>Definindo imagens no HTML</h1>

            <img src="img/buraco negro.png" alt="Estrela Decaída" width="400"height="400">

            <img src="img/buraco negro.png" alt="'Portal'" style="width:500px; height:600;">

            <h3>Utilizando Imagens Flutuante</h3>

            <p>
                <img src="img/buraco.gif" style="width:100px; height:100px; float:left;">
            Buraco Negro é uma Invenção Cientifica?
            </p>
            

    </body>
