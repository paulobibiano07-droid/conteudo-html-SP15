<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 10 - HTML</title>
    </head>
    <body>
       <h1>Definindo Listas no HTML</h1> 

       <h3>Exemplo de lista não ordenada</h3>

       <ul>
        <li>Item</li>
        <li>item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        

    <hr>

        <h3>Exemplo ordem ordenada</h3>

        <ol>
            <li>item</li>
            <li>item</li>
            <li>item</li>
            <li>item</li>
            <li>item</li>
        </ol>


       </ul>
    </body>
</html>
