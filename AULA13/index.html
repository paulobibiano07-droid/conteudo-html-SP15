<!doctype html>
<html>
    <head>
        <title>Conteúdo Aula13 - HTML </title>


        <style>
            .importante {
                color:cornflowerblue;
                font-weight:bold;
                font-size: 200%;
            }

            .class{
                color:brown;
                font-weight: medium;
                font-size: 300%;
            }

            .cidade{
                background-color:green;
                border: 6px solid red;
                color:white;
                padding: 12px;
                
            }

            .centralizada{
                text-align: center;
            }

            .estilo{
                background-color: black;
                color:brown;
                padding: 10px;
                border: 4px double red ;

            }
        </style>
    </head>
    <body>
        <h1><span class="class">class</span> em HTML</h1>

            <h2>Titulo<span class="importante">importante</span></h2>

                <p>Exemplo de conteúdo <span class="importante">importante</span> no HTML</p>


        <hr>

                <h3>Definindo mais de uma classe para elementos</h3>

                <h2 class="cidade centralizada">São Paulo</h2>
                <h2 class="cidade">Rio de Janeiro</h2>
                <h2 class="cidade">Belo Horinzonte</h2>
                <h2 class="cidade">Brasilia</h2>
                <h2 class="cidade" >Natal</h2>
                <h2 class="cidade">Porto Alegre</h2>


        <hr>

                <h3>Mesmas classes em elementos diferentes</h3>

                <h2 class="estilo">Eu sou h2</h2>
                <p class="estilo">eu sou um paragrafo</p>


        <hr>

                

              
    </body>
</html>
