    <h1>Introdução a Formulário no HTML</h1>

        <h3>input tipo Texto</h3>

<hr>


    <h3>input tipo Radio</h3>

    <form>
        <input type="radio" name="tec-opcoes" id="HTML" value="HTML">
        <label for="HTML">HTML</label><br>
        <input type="radio" name="tec-opcoes" id="CSS" value="CSS">
        <label for="CSS">CSS</label><br>

        <label for="JavaScript">JavaScript</label><br>
    </form>
