<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula16 - HTML</title>
</head>
<body>

    <h1>Introdução a Formulário no HTML</h1>

        <h3>input tipo Texto</h3>

    <form action="">
        <label for="p-nome">Primeiro Nome</label><br>
        <input type="text" name="p-nome" id="p-nome"><br>
        <label for="u-name">Ultimo</label><br>
        <input type="text" name="u-nome" id="u-name"><br><br>
        <input type="button" value="Enviar Dados">
    </form>

<hr>


    <h3>input tipo Radio</h3>

    <form>
        <input type="radio" name="tec-opcoes" id="HTML" value="HTML">
        <label for="HTML">HTML</label><br>
        <input type="radio" name="tec-opcoes" id="CSS" value="CSS">
        <label for="CSS">CSS</label><br>
        <input type="radio" name="tec-opcoes" id="JavaScript" value="JavaScript">
        <label for="JavaScript">JavaScript</label><br>
    </form>

    <hr>

     <h3>Input tipo Checkbox</h3>

    <form>
      <input type="checkbox" name="fruta1" id="laranja" value="Laranja">
      <label for="laranja">Laranja</label>
      <br>
      <input type="checkbox" name="fruta2" id="maracuja" value="Maracujá">
      <label for="maracuja">Maracujá</label>
      <br>
      <input type="checkbox" name="fruta3" id="morango" value="Morango">
      <label for="morango">Morango</label>
      <br>
    </form>

<hr>


    <h3>Input tipo Submit</h3>

        <form action="../AULA11/index02.html">
        <label for="name">Nome</label>
        <input type="text" name="nome" id="name">
        <input type="submit" value="Enviar">
            
        </form>

    


    
</body>
</html>
